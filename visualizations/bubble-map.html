<!DOCTYPE html>
<!-- Animated bubble map using D3 + Leaflet -->
<!-- Data: ../data/processed/parrot_by_location_year.json -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parrot Colony · Animated</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link rel="stylesheet" href="styles-bubble.css">
<style>
/* ── SIZE + COLOR LEGEND ── */
.legend-wrap {
  margin-top: 16px;
  border-top: 1px solid #d8ceb8;
  padding-top: 12px;
}
.leg-section-title {
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: #93876F;
  margin-bottom: 8px;
  font-family: 'DM Sans', sans-serif;
}

/* color legend */
.color-leg {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #5a5040;
  font-family: 'DM Sans', sans-serif;
}
.leg-dot {
  border-radius: 50%;
  flex-shrink: 0;
}

/* size legend */
.size-leg {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.size-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #93876F;
  font-family: 'DM Sans', sans-serif;
}
.size-circle {
  border-radius: 50%;
  background: #93876F;
  opacity: 0.4;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="outer">

  <!-- LEFT: map fills remaining space -->
  <div class="map-side">
    <!-- slider sits above map -->
    <div class="slider-row">
      <input type="range" id="year-slider" min="2010" max="2025" value="2010" step="1">
      <div class="tick-row">
        <span>2010</span><span>2013</span><span>2016</span><span>2019</span><span>2022</span><span>2025</span>
      </div>
    </div>
    <div class="map-wrap">
      <div id="leaflet-map"></div>
      <svg id="overlay-svg"></svg>
    </div>
  </div>

  <!-- RIGHT: fixed width panel -->
  <div class="right-panel">
    <button class="play-btn" id="play-btn">Play</button>

    <!-- big year -->
    <div class="year-display" id="year-display">2010</div>

    <!-- stats -->
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-lbl">Total sightings this year</div>
    </div>

    <div class="stat">
      <div class="stat-num stat-top" id="stat-top">—</div>
      <div class="stat-lbl">Dominant location</div>
    </div>

    <!-- color legend -->
    <div class="leg-section">
      <div class="leg-title">Color</div>
      <div class="leg-item">
        <div class="leg-dot" style="background:#2F7D97;"></div>
        Dominant site that year
      </div>
      <div class="leg-item">
        <div class="leg-dot" style="background:#7F907F;"></div>
        Secondary sites
      </div>
    </div>

    <!-- size legend -->
    <div class="leg-section">
      <div class="leg-title">Bubble size = sightings</div>
      <div class="size-leg" id="size-legend"></div>
    </div>
  </div>

</div>

<script>
// shared scale — must match what's used in draw()
const MAX_N = 92;
const rSc = d3.scaleSqrt().domain([0, MAX_N]).range([0, 38]);

// ── BUILD SIZE LEGEND ──────────────────────────────────────────────────────
const sizeLegend = document.getElementById('size-legend');
const displayScale = d3.scaleSqrt().domain([0, MAX_N]).range([0, 24]);
[10, 30, 60, 92].forEach(n => {
  const r = displayScale(n);
  const d = r * 2;
  const item = document.createElement('div');
  item.className = 'size-item';
  item.innerHTML = `
  <div class="size-circle" style="width:${d}px;height:${d}px;"></div>
  <span>${n} sigtings</span>
`;
  sizeLegend.appendChild(item);
});

d3.json('../data/processed/parrot_by_location_year.json').then(parrotData => {

  // ── MAP SETUP ──────────────────────────────────────────────────────────────
  const map = L.map('leaflet-map', {
    center: [37.778, -122.442], zoom: 13,
    zoomControl: false, scrollWheelZoom: false,
    dragging: false, doubleClickZoom: false,
    touchZoom: false, keyboard: false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 19, subdomains: 'abcd',
  }).addTo(map);

  const svg     = d3.select('#overlay-svg');
  const bubbleG = svg.append('g');
  const labelG  = svg.append('g');

  const project = (lat, lng) => {
    const pt = map.latLngToContainerPoint([lat, lng]);
    return [pt.x, pt.y];
  };

  // ── DRAW ──────────────────────────────────────────────────────────────────
  function draw(year) {
    const yr = String(year);
    const locs = Object.entries(parrotData)
      .map(([name, d]) => ({name, lat: d.lat, lng: d.lng, n: +(d.years[yr] || 0)}))
      .sort((a, b) => a.n - b.n);

    const total  = d3.sum(locs, d => d.n);
    const top    = locs.reduce((a, b) => a.n > b.n ? a : b);
    const yearMax = top.n;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-top').textContent   = top.n > 0 ? top.name.split(' /')[0] : 'None';

    // bubbles
    bubbleG.selectAll('circle').data(locs, d => d.name)
      .join(
        enter => enter.append('circle')
          .attr('cx', d => project(d.lat, d.lng)[0])
          .attr('cy', d => project(d.lat, d.lng)[1])
          .attr('r', 0)
          .attr('fill',  d => d.n === yearMax && d.n > 0 ? '#05597A' : '#627461')
          .attr('opacity', 0.78)
          .attr('stroke', '#F9F8FA').attr('stroke-width', 1.5)
          .call(e => e.transition().duration(400).attr('r', d => rSc(d.n))),
        update => update
          .call(u => u.transition().duration(400)
            .attr('r',    d => rSc(d.n))
            .attr('fill', d => d.n === yearMax && d.n > 0 ? '#05597A' : '#627461'))
      );

    // count labels inside bubbles
    labelG.selectAll('.cnt').data(locs.filter(d => d.n >= 5), d => d.name)
      .join(
        enter => enter.append('text').attr('class', 'cnt')
          .attr('text-anchor', 'middle').attr('font-size', 9.5)
          .attr('font-weight', '500').attr('fill', '#F9F8FA')
          .attr('font-family', 'DM Sans, sans-serif')
          .attr('opacity', 0)
          .call(e => e.transition().duration(400).attr('opacity', 1)),
        update => update,
        exit   => exit.remove()
      )
      .attr('x', d => project(d.lat, d.lng)[0])
      .attr('y', d => project(d.lat, d.lng)[1] + 4)
      .text(d => d.n);

    // name labels for top sites
    labelG.selectAll('.nlbl').remove();
    const offsets = {
      'Fort Mason':      [0, -1],
      'Telegraph Hill':  [1,  0],
      'Presidio':        [-1, 0],
      'Golden Gate Park':[0,  1],
      'Corona Heights':  [1,  0],
    };
    locs.filter(d => d.n >= 15).sort((a,b) => b.n - a.n).slice(0, 2).forEach(d => {
      const [px, py] = project(d.lat, d.lng);
      const r   = rSc(d.n);
      const dir = offsets[d.name] || [1, 0];
      const off = [dir[0] * (r + 8), dir[1] * (r + 10)];
      labelG.append('text').attr('class', 'nlbl')
        .attr('x', px + off[0]).attr('y', py + off[1])
        .attr('text-anchor', dir[0] < 0 ? 'end' : dir[0] === 0 ? 'middle' : 'start')
        .attr('font-size', 9).attr('font-weight', '500')
        .attr('fill', '#1a1208').attr('font-family', 'DM Sans, sans-serif')
        .style('text-shadow', '0 1px 3px rgba(249,248,250,0.9)')
        .text(d.name);
    });
  }

  // ── SLIDER ────────────────────────────────────────────────────────────────
  const slider      = document.getElementById('year-slider');
  const yearDisplay = document.getElementById('year-display');

  slider.addEventListener('input', () => {
    yearDisplay.textContent = slider.value;
    draw(+slider.value);
  });

  // ── PLAY / PAUSE ──────────────────────────────────────────────────────────
  let playing  = false;
  let interval = null;
  const playBtn = document.getElementById('play-btn');

  playBtn.addEventListener('click', () => {
    if (playing) {
      clearInterval(interval);
      playing = false;
      playBtn.textContent = 'Play';
    } else {
      playing = true;
      playBtn.textContent = 'Pause';
      let yr = +slider.value >= 2025 ? 2010 : +slider.value;
      interval = setInterval(() => {
        yr++;
        slider.value = yr;
        yearDisplay.textContent = yr;
        draw(yr);
        if (yr >= 2025) {
          clearInterval(interval);
          playing = false;
          playBtn.textContent = 'Play';
        }
      }, 900);
    }
  });

  map.whenReady(() => draw(2010));

}).catch(() => {
  document.querySelector('.sub').textContent =
    'Run with python3 -m http.server — loads from ../data/processed/parrot_by_location_year.json';
});
</script>
</body>
</html>
